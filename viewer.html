<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Building Guide — 3D Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: #fff; }

  #app { display: flex; height: 100vh; width: 100vw; }

  /* SIDEBAR */
  #sidebar {
    width: 260px; min-width: 260px;
    background: linear-gradient(180deg, #16213e 0%, #0f3460 100%);
    display: flex; flex-direction: column;
    border-right: 2px solid #e94560;
    overflow: hidden; z-index: 10;
  }
  #sidebar-header {
    padding: 18px 16px 12px;
    background: linear-gradient(135deg, #e94560, #c62a47);
    text-align: center;
  }
  #sidebar-header h1 { font-size: 14px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
  #sidebar-header p { font-size: 10px; opacity: 0.85; margin-top: 2px; letter-spacing: 0.5px; }

  #build-list { flex: 1; overflow-y: auto; padding: 8px; }
  #build-list::-webkit-scrollbar { width: 4px; }
  #build-list::-webkit-scrollbar-track { background: transparent; }
  #build-list::-webkit-scrollbar-thumb { background: #e94560; border-radius: 2px; }

  .build-btn {
    width: 100%; text-align: left; padding: 10px 12px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; margin-bottom: 6px; cursor: pointer; color: #fff;
    transition: all 0.2s; display: flex; flex-direction: column; gap: 3px;
  }
  .build-btn:hover { background: rgba(233,69,96,0.2); border-color: #e94560; }
  .build-btn.active { background: rgba(233,69,96,0.35); border-color: #e94560; box-shadow: 0 0 12px rgba(233,69,96,0.4); }
  .build-btn .num { font-size: 9px; color: #e94560; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .build-btn .name { font-size: 12px; font-weight: 600; }
  .build-btn .meta { font-size: 10px; opacity: 0.55; }

  #build-info {
    padding: 12px 14px;
    background: rgba(0,0,0,0.3);
    border-top: 1px solid rgba(255,255,255,0.07);
    font-size: 11px;
    min-height: 80px;
  }
  #build-info h3 { font-size: 12px; color: #e94560; margin-bottom: 6px; font-weight: 700; }
  #build-info p { opacity: 0.7; line-height: 1.6; }

  /* CANVAS AREA */
  #canvas-wrap {
    flex: 1; position: relative; overflow: hidden;
  }
  #canvas-wrap canvas { display: block; }

  /* TOP BAR */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 10px 16px;
    background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
    display: flex; align-items: center; gap: 12px;
    pointer-events: none;
  }
  #topbar .title { font-size: 16px; font-weight: 700; }
  #topbar .badge {
    padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .badge.beginner { background: #27ae60; }
  .badge.intermediate { background: #f39c12; }
  .badge.advanced { background: #e74c3c; }
  .badge.expert { background: #8e44ad; }

  /* BOTTOM CONTROLS */
  #controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 12px 20px;
    background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
    display: flex; align-items: center; gap: 16px;
  }
  #controls label { font-size: 11px; opacity: 0.8; white-space: nowrap; }
  #layer-slider { flex: 1; max-width: 280px; accent-color: #e94560; cursor: pointer; }
  .ctrl-btn {
    padding: 6px 14px; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px; background: rgba(255,255,255,0.08);
    color: #fff; font-size: 11px; cursor: pointer; transition: all 0.2s;
  }
  .ctrl-btn:hover { background: rgba(233,69,96,0.4); border-color: #e94560; }
  #coord-display { font-size: 10px; opacity: 0.5; margin-left: auto; }

  /* LEGEND */
  #legend {
    position: absolute; top: 50px; right: 12px;
    background: rgba(0,0,0,0.65); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; padding: 10px 12px;
    max-width: 150px; font-size: 10px;
    max-height: 70vh; overflow-y: auto;
  }
  #legend h4 { font-size: 11px; color: #e94560; margin-bottom: 8px; font-weight: 700; }
  .legend-item { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.2); }
  .legend-name { opacity: 0.8; }

  /* LOADING */
  #loading {
    position: absolute; inset: 0; background: rgba(22,33,62,0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    transition: opacity 0.4s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid rgba(233,69,96,0.3);
    border-top-color: #e94560; border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { font-size: 13px; opacity: 0.7; }

  /* TOOLTIP */
  #tooltip {
    position: absolute; padding: 6px 10px; background: rgba(0,0,0,0.85);
    border: 1px solid #e94560; border-radius: 6px; font-size: 11px;
    pointer-events: none; display: none; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>⛏ MC Build Guide</h1>
      <p>10 Premium 3D Builds</p>
    </div>
    <div id="build-list"></div>
    <div id="build-info"><h3>Select a Build</h3><p>Click any build to load it in 3D.</p></div>
  </div>

  <div id="canvas-wrap">
    <div id="topbar">
      <span class="title" id="top-title">Minecraft 3D Building Guide</span>
      <span class="badge" id="top-badge" style="display:none"></span>
    </div>

    <div id="controls">
      <label>Layer: <span id="layer-val">All</span></label>
      <input type="range" id="layer-slider" min="0" max="30" value="30">
      <button class="ctrl-btn" id="btn-reset">Reset View</button>
      <button class="ctrl-btn" id="btn-explode">Explode</button>
      <span id="coord-display">Drag to rotate • Scroll to zoom • Right-drag to pan</span>
    </div>

    <div id="legend"><h4>Materials</h4><div id="legend-items"></div></div>
    <div id="loading"><div class="spinner"></div><p>Loading 3D viewer…</p></div>
    <div id="tooltip"></div>
  </div>
</div>
